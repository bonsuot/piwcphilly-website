<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beliefs - PIWC Philadelphia</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!--Favicon-->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div id="app"></div>

    <script src="../js/site-data.js"></script>
    <script src="../js/template-engine.js"></script>
    
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                ${TemplateEngine.renderNavigation(SITE_DATA.navigation, SITE_DATA.site)}
                
                ${TemplateEngine.renderPageHero('Our Beliefs', 'The Church of Pentecost deems our tenets or beliefs as one of the most critical aspects of our worship because it forms the basics of the Christian doctrine. Once you get it right, you will be able to grow in the Christian faith. For this reason, the founding fathers and other leaders of the church have prayerfully and thoughtfully selected 11 doctrinal beliefs of The Church of Pentecost with accompanying Scriptures to facilitate study and understanding. These basic doctrines of The Church of Pentecost, which we jealously guard, are as follows:')}
                
                <section class="py-5">
                    <div class="container">
                        <div class="beliefs-grid">
                            ${SITE_DATA.beliefs.map(belief => `
                                <div class="belief-card">
                                    <div class="belief-icon">
                                        <i class="${belief.icon}"></i>
                                    </div>
                                    <h3>${belief.title}</h3>
                                    <p>${belief.content}</p>
                                    <p class="belief-scripture"><em>${belief.scripture}</em></p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
                
                ${TemplateEngine.renderFooter(SITE_DATA.site, SITE_DATA.social)}
                ${TemplateEngine.renderSuggestionModal()}
            `;
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
</body>
</html>
