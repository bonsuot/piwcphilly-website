<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Pantry Ministry - PIWC Philadelphia</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div id="app"></div>

    <script src="../js/site-data.js"></script>
    <script src="../js/template-engine.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const app = document.getElementById('app');
            const ministry = SITE_DATA.ministries.foodPantry;
            
            app.innerHTML = `
                ${TemplateEngine.renderNavigation(SITE_DATA.navigation, SITE_DATA.site)}
                
                ${TemplateEngine.renderMinistryHero(ministry)}
                
                ${TemplateEngine.renderMissionVision(ministry.mission, ministry.vision)}
                
                <section class="py-5">
                    <div class="container">
                        <h2 class="section-title text-center mb-5">Our Activities</h2>
                        <div class="row">
                            ${ministry.activities.map(activity => `
                                <div class="col-md-6 mb-3">
                                    <div class="activity-item p-3 bg-light rounded">
                                        <i class="fas fa-check-circle text-primary me-2"></i>
                                        <span style="font-size: 1.1rem;">${activity}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
                
                ${ministry.leaders ? TemplateEngine.renderMinistryLeaders(ministry.leaders) : ''}
                
                <section class="join-section">
                    <div class="container text-center">
                        <h2 class="mb-4">Join Our Ministry</h2>
                        <p class="mb-4" style="font-size: 1.2rem;">Join us Every Saturday @ 10:00 AM to serve the community.</p>
                        <a href="../templates/contact.html" class="btn btn-outline-primary btn-lg">Get Involved</a>
                    </div>
                </section>
                
                ${TemplateEngine.renderFooter(SITE_DATA.site, SITE_DATA.social)}
                ${TemplateEngine.renderSuggestionModal()}
            `;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
