<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Values - PIWC Philadelphia</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!--Favicon-->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div id="app"></div>

    <script src="../js/site-data.js"></script>
    <script src="../js/template-engine.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                ${TemplateEngine.renderNavigation(SITE_DATA.navigation, SITE_DATA.site)}
                
                ${TemplateEngine.renderPageHero('Core Values', 'The principles that guide our faith and service')}
                
                <section class="py-5">
                    <div class="container">
                        <div class="coreValues-grid">
                            ${SITE_DATA.coreValues.map(coreValues => `
                                <div class="coreValues-card">
                                    <div class="coreValues-icon">
                                        <i class="${coreValues.icon}"></i>
                                    </div>
                                    <h3>${coreValues.title}</h3>
                                    <p>${coreValues.content}</p>
                                    <p class="coreValues-scripture"><em>${coreValues.scripture}</em></p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
                
                ${TemplateEngine.renderFooter(SITE_DATA.site, SITE_DATA.social)}
                ${TemplateEngine.renderSuggestionModal()}
            `;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
