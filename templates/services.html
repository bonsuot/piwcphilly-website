<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - PIWC Philadelphia</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div id="page-wrapper"></div>

    <!-- Load Bootstrap and other dependencies FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/site-data.js"></script>
    <script src="../js/template-engine.js"></script>
    
    <script>
        // Load base template
        document.addEventListener('DOMContentLoaded', function() {
            fetch('./base.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load base.html: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Get elements from base
                    const nav = doc.querySelector('nav');
                    const footer = doc.querySelector('footer');
                    const modals = doc.querySelectorAll('.modal');
                    
                    if (!nav || !footer) {
                        throw new Error('Could not find nav or footer in base.html');
                    }
                    
                    // Build page
                    document.getElementById('page-wrapper').innerHTML = `
                        ${nav.outerHTML}
                        
                        <main id="content">
                        <!-- Page Hero -->
                        <section class="page-hero py-5" style="background: linear-gradient(to right, #f8f9fa 0%, #ffffff 100%); margin-top: 80px;">
                            <div class="container">
                                <h1 class="hero-title text-center mb-4" style="color: #1B2845; font-size: 2.5rem; font-weight: 700;">Our Services</h1>
                                <p class="hero-text text-center" style="color: #4b5563; font-size: 1.2rem; max-width: 800px; margin: 0 auto;">Join us for inspiring worship, powerful teaching, and fellowship</p>
                            </div>
                        </section>

                        <!-- Service Times Section -->
                        <section class="py-5">
                            <div class="container">
                                <h2 class="section-title text-center mb-5" style="color: #1B2845;">Weekly Services</h2>
                                <div class="row">
                                    ${(window.SITE_DATA?.services || []).map(service => `
                                        <div class="col-md-4 mb-4">
                                            <div class="service-card">
                                                <div class="service-card-image">
                                                    <div class="service-icon-large">
                                                        <i class="${service.icon}"></i>
                                                    </div>
                                                </div>
                                                <div class="card-body text-center p-4">
                                                    <h3 class="service-title mb-3">${service.title}</h3>
                                                    <div class="service-details mb-3">
                                                        <p class="mb-2"><i class="far fa-clock text-primary me-2"></i><strong>Time:</strong> ${service.time}</p>
                                                        <p class="mb-2"><i class="fas fa-map-marker-alt text-primary me-2"></i><strong>Location:</strong> ${service.location}</p>
                                                    </div>
                                                    ${service.description ? `<p class="text-muted">${service.description}</p>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </section>

                        <!-- What to Expect Section -->
                        <section class="py-5" style="background-color: #f8f9fa;">
                            <div class="container">
                                <h2 class="section-title text-center mb-5" style="color: #1B2845;">What to Expect</h2>
                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <div class="expectation-card p-4 bg-white rounded shadow-sm h-100">
                                            <div class="icon-circle mb-3" style="width: 60px; height: 60px; background: #1B2845; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                                <i class="fas fa-music" style="color: #ffd700; font-size: 1.5rem;"></i>
                                            </div>
                                            <h4 style="color: #1B2845;">Worship Experience</h4>
                                            <p class="text-muted">Join us in Spirit-filled worship with contemporary and traditional songs of praise.</p>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <div class="expectation-card p-4 bg-white rounded shadow-sm h-100">
                                            <div class="icon-circle mb-3" style="width: 60px; height: 60px; background: #1B2845; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                                <i class="fas fa-book-open" style="color: #ffd700; font-size: 1.5rem;"></i>
                                            </div>
                                            <h4 style="color: #1B2845;">Biblical Teaching</h4>
                                            <p class="text-muted">Experience practical, life-changing messages rooted in God's Word.</p>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <div class="expectation-card p-4 bg-white rounded shadow-sm h-100">
                                            <div class="icon-circle mb-3" style="width: 60px; height: 60px; background: #1B2845; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                                <i class="fas fa-hands-praying" style="color: #ffd700; font-size: 1.5rem;"></i>
                                            </div>
                                            <h4 style="color: #1B2845;">Prayer & Ministry</h4>
                                            <p class="text-muted">Receive prayer and ministry from our dedicated prayer team.</p>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <div class="expectation-card p-4 bg-white rounded shadow-sm h-100">
                                            <div class="icon-circle mb-3" style="width: 60px; height: 60px; background: #1B2845; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                                <i class="fas fa-users" style="color: #ffd700; font-size: 1.5rem;"></i>
                                            </div>
                                            <h4 style="color: #1B2845;">Warm Fellowship</h4>
                                            <p class="text-muted">Connect with our loving church family in a welcoming atmosphere.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Live Stream CTA -->
                        <section class="py-5 text-center" style="background: linear-gradient(135deg, #1B2845 0%, #3949ab 100%);">
                            <div class="container">
                                <div class="row justify-content-center">
                                    <div class="col-lg-8">
                                        <i class="fas fa-video" style="font-size: 3rem; color: #ffd700; margin-bottom: 1.5rem;"></i>
                                        <h2 class="mb-3" style="color: white;">Can't Join Us in Person?</h2>
                                        <p class="mb-4" style="color: #f8f9fa; font-size: 1.1rem;">Watch our services live online every Sunday at 8:30 AM EST</p>
                                        <a href="../index.html#live-worship" class="btn btn-lg" style="background: #ffd700; color: #1B2845; font-weight: 600; padding: 12px 40px; border-radius: 50px;">
                                            <i class="fab fa-youtube me-2"></i>Watch Live Stream
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Contact Section -->
                        <section class="py-5">
                            <div class="container">
                                <div class="row justify-content-center">
                                    <div class="col-lg-8 text-center">
                                        <h2 class="mb-4" style="color: #1B2845;">Have Questions?</h2>
                                        <p class="mb-4 text-muted">We'd love to hear from you! Reach out if you have any questions about our services.</p>
                                        <a href="contact.html" class="btn btn-outline-primary btn-lg">Contact Us</a>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>
                    
                    ${footer.outerHTML}
                    ${Array.from(modals).map(m => m.outerHTML).join('')}
                `;

                // Reinitialize navbar toggle
                reinitNavbarToggle();
                
                // Load Bootstrap JS AFTER nav is in DOM
                const bootstrapScript = document.createElement('script');
                bootstrapScript.src = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js';
                bootstrapScript.defer = true;
                document.body.appendChild(bootstrapScript);


                // Load scripts from base.html safely (avoid document.write which can overwrite the document)
                const scripts = doc.querySelectorAll('script');
                // Append external scripts and safely handle inline scripts
                scripts.forEach(script => {
                    const src = script.getAttribute('src');
                    const text = script.textContent || '';

                    if (src) {
                        const s = document.createElement('script');
                        s.src = src;
                        s.defer = true;
                        document.body.appendChild(s);
                        return;
                    }

                    // If the inline script uses document.write, do NOT eval it — replace the script node in the inserted DOM
                    if (/\bdocument\.write\s*\(/.test(text)) {
                        const wrapper = document.getElementById('page-wrapper');
                        // Find script nodes inside the wrapper and replace those that contain document.write
                        const inlineScripts = wrapper.querySelectorAll('script');
                        inlineScripts.forEach(node => {
                            const nodeText = node.textContent || '';
                            if (/\bdocument\.write\s*\(/.test(nodeText)) {
                                const replacement = document.createTextNode(String(new Date().getFullYear()));
                                node.parentNode.replaceChild(replacement, node);
                            }
                        });
                        return;
                    }

                    // Safe inline script: execute by appending a new script element
                    const s = document.createElement('script');
                    s.textContent = text;
                    document.body.appendChild(s);
                });

                // Reinitialize Bootstrap components (dropdowns, modals, etc.) after content is inserted
                // This ensures new dropdown elements have Bootstrap event handlers attached
                // const dropdownElementList = document.querySelectorAll('[data-bs-toggle="dropdown"]');
                // dropdownElementList.forEach(dropdownToggleEl => {
                //     new bootstrap.Dropdown(dropdownToggleEl);
                // });

                // Initialize modals
                const modalElementList = document.querySelectorAll('[data-bs-toggle="modal"]');
                modalElementList.forEach(modalToggleEl => {
                    new bootstrap.Modal(modalToggleEl.getAttribute('data-bs-target'));
                });

                // Initialize tooltips if any exist
                const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                tooltipTriggerList.map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
            })
            .catch(error => {
                console.error('Error loading services page:', error);
                document.getElementById('page-wrapper').innerHTML = '<p style="color: red; padding: 20px;">Error loading page content. Please refresh and try again.</p>';
            });
        });
    </script>
    
    <!-- <script type="module" src="../js/main.js"></script> -->
    <script src="../js/main.js"></script>


</body>
</html>
